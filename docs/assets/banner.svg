<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.50; transform: scale(1.08); }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }
      @keyframes beam-slide {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(900px); }
      }
      .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .pulse-bg { animation: pulse-glow 5s ease-in-out infinite; transform-origin: 450px 110px; }
      .live-dot { animation: pulse-dot 2.5s ease-in-out infinite; transform-origin: center; }
      .beam-line { animation: beam-slide 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>

    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111116"/>
      <stop offset="50%" stop-color="#16161F"/>
      <stop offset="100%" stop-color="#1F1E29"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9585FF"/>
      <stop offset="50%" stop-color="#6353D9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="text-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F6F5FA"/>
      <stop offset="100%" stop-color="#C7C5D2"/>
    </linearGradient>

    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9585FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9585FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="iris-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9585FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6353D9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#111116" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card-clip">
      <rect x="2" y="2" width="896" height="216" rx="18"/>
    </clipPath>
  </defs>

  <!-- Container Surface -->
  <rect x="1" y="1" width="898" height="218" rx="20" fill="url(#panel-bg)" stroke="#393946" stroke-width="1.5"/>

  <!-- Clipped Ambient Elements -->
  <g clip-path="url(#card-clip)">
    <!-- Radial Ambient Glow -->
    <ellipse cx="450" cy="90" rx="360" ry="110" fill="url(#iris-glow)" class="pulse-bg"/>

    <!-- Subtle Dot Grid Matrix -->
    <pattern id="dot-matrix" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <rect x="0" y="0" width="900" height="220" fill="url(#dot-matrix)"/>

    <!-- Top Accent Highlight -->
    <rect x="0" y="0" width="900" height="2" fill="url(#accent-grad)"/>

    <!-- Animated Scanning Beam -->
    <rect x="0" y="1" width="280" height="2" fill="url(#beam-grad)" class="beam-line"/>
  </g>

  <!-- Branding & Typography -->
  <g class="font-main" text-anchor="middle">
    <!-- Version Tag -->
    <g transform="translate(450, 48)">
      <rect x="-120" y="-12" width="240" height="24" rx="12" fill="#202029" stroke="#393946" stroke-width="1"/>
      <circle cx="-96" cy="0" r="4" fill="#10B981" class="live-dot"/>
      <text x="10" y="4" font-size="11" font-weight="600" fill="#C7C5D2" letter-spacing="1.2">PRICEPILOT &bull; RELEASE v1.3</text>
    </g>

    <!-- Main Title -->
    <text x="450" y="112" font-size="44" font-weight="800" fill="url(#text-title)" letter-spacing="-0.8">
      PricePilot
    </text>

    <!-- Value Proposition -->
    <text x="450" y="146" font-size="15" font-weight="500" fill="#C7C5D2" letter-spacing="-0.2">
      Intelligent Shopping &bull; Normalized Marketplace Offers &bull; Grounded Evidence
    </text>

    <!-- Sub-status / Verification Pills -->
    <g transform="translate(450, 182)">
      <text x="0" y="0" font-size="11.5" font-weight="500" fill="#9585FF" letter-spacing="0.4">
        853 Backend Tests Passing &nbsp;&bull;&nbsp; 256 Frontend Tests &nbsp;&bull;&nbsp; Verified Offline Architecture
      </text>
    </g>
  </g>
</svg>
