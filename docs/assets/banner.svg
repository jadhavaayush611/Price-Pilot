<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>

    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101015"/>
      <stop offset="50%" stop-color="#15151F"/>
      <stop offset="100%" stop-color="#1C1B26"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9585FF"/>
      <stop offset="50%" stop-color="#6353D9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="iris-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#9585FF" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#6353D9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#101015" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card-clip">
      <rect x="2" y="2" width="896" height="256" rx="18"/>
    </clipPath>
  </defs>

  <!-- Container Surface -->
  <rect x="1" y="1" width="898" height="258" rx="20" fill="url(#panel-bg)" stroke="#323242" stroke-width="1.5"/>

  <!-- Clipped Ambient Elements -->
  <g clip-path="url(#card-clip)">
    <!-- Radial Ambient Glow -->
    <ellipse cx="450" cy="70" rx="360" ry="90" fill="url(#iris-glow)"/>

    <!-- Subtle Dot Grid Matrix -->
    <pattern id="dot-matrix" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <rect x="0" y="0" width="900" height="260" fill="url(#dot-matrix)"/>

    <!-- Top Accent Highlight -->
    <rect x="0" y="0" width="900" height="2" fill="url(#accent-grad)"/>
  </g>

  <!-- Branding & Header Typography -->
  <g class="font-main" text-anchor="middle">
    <!-- Main Title -->
    <text x="450" y="58" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">
      PricePilot
    </text>

    <!-- Subtitle -->
    <text x="450" y="82" font-size="11" font-weight="700" fill="#9585FF" letter-spacing="1.5">
      AUTONOMOUS COMMERCE INTELLIGENCE
    </text>
  </g>

  <!-- Three Concise Concept Cards -->
  <g class="font-main" transform="translate(60, 102)">
    <!-- Concept 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="780" height="36" rx="8" fill="#181724" stroke="#2A2938" stroke-width="1"/>
      <circle cx="22" cy="18" r="4.5" fill="#38BDF8"/>
      <text x="40" y="22" font-size="13" font-weight="700" fill="#FFFFFF">Intelligent shopping and product discovery</text>
      <text x="322" y="22" font-size="13" font-weight="500" fill="#9585FF">&bull;</text>
      <text x="338" y="22" font-size="13" font-weight="400" fill="#BDBCC9">AI-guided search &amp; semantic relevance</text>
    </g>

    <!-- Concept 2 -->
    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="780" height="36" rx="8" fill="#181724" stroke="#2A2938" stroke-width="1"/>
      <circle cx="22" cy="18" r="4.5" fill="#38BDF8"/>
      <text x="40" y="22" font-size="13" font-weight="700" fill="#FFFFFF">Marketplace offer comparison</text>
      <text x="246" y="22" font-size="13" font-weight="500" fill="#9585FF">&bull;</text>
      <text x="262" y="22" font-size="13" font-weight="400" fill="#BDBCC9">Transparent pricing and fee disclosures</text>
    </g>

    <!-- Concept 3 -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="780" height="36" rx="8" fill="#181724" stroke="#2A2938" stroke-width="1"/>
      <circle cx="22" cy="18" r="4.5" fill="#38BDF8"/>
      <text x="40" y="22" font-size="13" font-weight="700" fill="#FFFFFF">Evidence-based purchasing decisions</text>
      <text x="296" y="22" font-size="13" font-weight="500" fill="#9585FF">&bull;</text>
      <text x="312" y="22" font-size="13" font-weight="400" fill="#BDBCC9">Normalized, trustworthy multi-seller comparisons</text>
    </g>
  </g>
</svg>
