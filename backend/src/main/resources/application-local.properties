server.port=8080

# In-memory H2 database for local development without external postgres requirement
spring.datasource.url=jdbc:h2:mem:pricepilotdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TSVECTOR AS VARCHAR
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway disabled for in-memory H2 dev
spring.flyway.enabled=false

# In-memory Simple Cache
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# PricePilot AI Gateway Configuration
pricepilot.ai.url=${PRICEPILOT_AI_URL:http://localhost:8000}
pricepilot.ai.api-key=${PRICEPILOT_AI_API_KEY:pricepilot-secret-api-key}

# JWT Secret
pricepilot.jwt.secret=${PRICEPILOT_JWT_SECRET:ZGV2LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLW90aGVyd2lzZS1qand0LXRocm93cy1leGNlcHRpb24tMTIzNDU2Nzg5MA==}

# Micrometer / Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=false

# Rate Limiting disabled for local dev ease
pricepilot.rate-limit.enabled=false
