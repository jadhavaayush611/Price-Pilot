spring.profiles.active=test
spring.application.name=pricepilot
spring.jpa.open-in-view=false

# PricePilot AI Gateway Configuration
pricepilot.ai.enabled=true
pricepilot.ai.timeout=5000
pricepilot.ai.retry-count=3
pricepilot.ai.url=${pricepilot.ai.url:http://localhost:8000}
pricepilot.ai.api-key=${pricepilot.ai.api-key:test-api-key}

# CORS Configuration
pricepilot.cors.allowed-origins=${PRICEPILOT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# PricePilot Semantic Intelligence Foundation (v1.2)
pricepilot.intelligence.semantic.enabled=true
pricepilot.intelligence.semantic.provider=local-deterministic
pricepilot.intelligence.semantic.model-name=local-hash-embedding
pricepilot.intelligence.semantic.model-version=v1
pricepilot.intelligence.semantic.dimension=64
pricepilot.intelligence.semantic.timeout-ms=5000
pricepilot.intelligence.semantic.batch-size=32
pricepilot.intelligence.semantic.min-similarity-score=0.0
pricepilot.intelligence.semantic.max-input-length=4096
