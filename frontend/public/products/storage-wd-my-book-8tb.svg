<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fb923c22" />
      <stop offset="60%" stop-color="#0c0e17" />
      <stop offset="100%" stop-color="#07080d" />
    </radialGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#2a2e45" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2337" />
      <stop offset="50%" stop-color="#161826" />
      <stop offset="100%" stop-color="#0e101a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#bgGlow)" />
  <rect x="1.5" y="1.5" width="597" height="597" rx="30.5" fill="none" stroke="url(#cardBorder)" stroke-width="2" />

  <g opacity="0.12" stroke="#fb923c" stroke-width="0.8" stroke-dasharray="4 8">
    <line x1="80" y1="120" x2="520" y2="120" />
    <line x1="80" y1="460" x2="520" y2="460" />
    <line x1="120" y1="80" x2="120" y2="520" />
    <line x1="480" y1="80" x2="480" y2="520" />
    <circle cx="300" cy="270" r="180" fill="none" />
  </g>

  <g transform="translate(300, 260)">
    
            <!-- Rugged Aluminum External Portable SSD -->
            <rect x="-70" y="-120" width="140" height="240" rx="24" fill="url(#bodyGrad)" stroke="#fb923c" stroke-width="2.5" />
            <rect x="-60" y="-110" width="120" height="220" rx="16" fill="#121522" stroke="#29304a" stroke-width="1.5" />
            <circle cx="40" cy="-90" r="12" fill="#0b0d16" stroke="#fb923c" stroke-width="2" />
            <rect x="-16" y="85" width="32" height="12" rx="4" fill="#0b0d16" stroke="#ea580c" stroke-width="1.5" />
            <line x1="-35" y1="0" x2="35" y2="0" stroke="#fb923c" stroke-width="2" opacity="0.6" />
            
  </g>

  <g transform="translate(48, 56)">
    <rect x="0" y="0" width="84" height="22" rx="6" fill="#181b2a" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1" />
    <text x="42" y="15" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">WD</text>
    <text x="96" y="15" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8">STORAGE</text>
  </g>

  <g transform="translate(48, 510)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">WD My Book 8TB</text>
    <text x="0" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" width="400">Desktop external hard drive with massive storage capacity.</text>
  </g>

  <g transform="translate(552, 510)">
    <text x="0" y="0" fill="#fb923c" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" font-weight="700" text-anchor="end">$169.00</text>
    <text x="0" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5" text-anchor="end">PRICEPILOT VERIFIED MODEL</text>
  </g>
</svg>