  <path d="M181 342V226C181 215 190 206 201 206H214C225 206 234 215 234 226V342Z" fill="#080A18"/>
  <path d="M244 342V174C244 163 253 154 264 154H277C288 154 297 163 297 174V342Z" fill="#080A18"/>

