<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PricePilot">
  <defs>
    <linearGradient id="ppGradient" x1="70" y1="430" x2="430" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ppGlow" x1="120" y1="390" x2="390" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
